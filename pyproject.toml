[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rca-consolidation-system"
version = "0.1.0"
description = "A modular foundation for consolidating telecom RCA workbooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "openpyxl",
    "pandas",
    "rapidfuzz",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
